<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Management Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        h1 {
            margin-bottom: 2rem;
            font-weight: 300;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 300px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: b;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }

        .card h2 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .card p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .btn {
            text-decoration: none;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s ease;
            display: inline-block;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* Responsive design for mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <h1>Safety Portals</h1>

    <div class="container">
        <div class="card">
            <div class="icon"><i class="fas fa-lock"></i></div>
            <h2>LOTO Pro</h2>
            <p>Access the Lockout Tagout Management System to manage energy isolation procedures and ensure worker safety.</p>
            <a href="https://sarath200795.github.io/LOTO-Management-System/auth.html" class="btn">Launch LOTO Pro</a>
        </div>

        <div class="card">
            <div class="icon"><i class="fas fa-shield-alt"></i></div>
            <h2>OHSMS</h2>
            <p>ISO 45001 Occupational Health and Safety Management System. Monitor compliance, risks, and safety standards.</p>
            <a href="https://sarath200795.github.io/iso45001/index.html" class="btn">Launch OHSMS</a>
        </div>
    </div>

</body>
</html>
